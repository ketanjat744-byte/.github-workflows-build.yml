name: Build Veda APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: JarvisAppFlutter
      - run: flutter build apk --release
        working-directory: JarvisAppFlutter
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Veda.apk
        working-directory: JarvisAppFlutter
      - uses: actions/upload-artifact@v4
        with:
          name: Veda-apk
          path: JarvisAppFlutter/build/app/outputs/flutter-apk/Veda.apk
